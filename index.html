<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Mechify | Automotive & Supercar Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script>
      (function() {
        const parts = window.location.pathname.split('/').filter(Boolean);
        if (window.location.hostname.endsWith('github.io') && parts.length > 0) {
          const base = '/' + parts[0] + '/';
          const rewrite = function(val) {
            if (typeof val === 'string' && val.startsWith('/') && !val.startsWith(base)) {
              return base + val.slice(1);
            }
            return val;
          };

          const patch = function(proto, prop) {
            const desc = Object.getOwnPropertyDescriptor(proto, prop);
            if (!desc || !desc.set) return;
            Object.defineProperty(proto, prop, {
              set: function(val) {
                desc.set.call(this, rewrite(val));
              },
              get: function() {
                return desc.get.call(this);
              },
              configurable: true,
              enumerable: true
            });
          };

          patch(HTMLImageElement.prototype, 'src');
          patch(HTMLMediaElement.prototype, 'src');
          patch(HTMLSourceElement.prototype, 'src');

          const origSetAttribute = Element.prototype.setAttribute;
          Element.prototype.setAttribute = function(name, val) {
            if (name && name.toLowerCase() === 'src') {
              val = rewrite(val);
            }
            return origSetAttribute.call(this, name, val);
          };
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
